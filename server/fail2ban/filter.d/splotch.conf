[Definition]
# Fail2ban filter for Splotch Ecommerce Server
# Matches hostile attempt warnings emitted by server/lib/securityAlerts.js
# Examples matched:
#   {"level":"warn","message":"[SECURITY] Hostile attempt from IP 1.2.3.4: Honeypot Trap Triggered on GET /.env"}
#   [SECURITY] Hostile attempt from IP 1.2.3.4: Sensitive Path Probe on GET /server/server.js
#   [SECURITY] Hostile attempt from IP 1.2.3.4: Auth Rate Limit Exceeded on POST /api/auth/pre-register

failregex = ^.*\[SECURITY\] Hostile attempt from IP <HOST>:.*$

ignoreregex =
